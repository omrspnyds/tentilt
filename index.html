<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<title>Ten Tilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a toy, not a tool; the letters are everything
   IDEA: a snow globe of 10s you hold in your hand
   PICTURE: the full-screen pile of letters reacting to the phone's tilt
   COLOUR and TYPE: the user's own colours; controls in one warm sheet, one red action; Figtree
   LAYOUT: full-bleed canvas; a small round button opens a bottom sheet of settings */
:root{color-scheme:light dark;--sheet:light-dark(#f6f5f2,#242427);--ink:light-dark(#1d1d1f,#ecebe8);--mute:light-dark(#6c6a66,#9d9b97);--line:light-dark(#d6d3cd,#38383c);--red:#e6261f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#fff;color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
#gear{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--sheet);font-size:22px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86dvh;overflow:auto;background:var(--sheet);border-radius:20px 20px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2);display:grid;gap:14px;touch-action:pan-y;-webkit-user-select:auto;user-select:auto}
h1{font-size:30px;line-height:1.05;margin:0;font-weight:800}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:inherit;min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;cursor:pointer}
.red{background:var(--red);border-color:var(--red);color:#fff;font-size:18px;font-weight:800}
.file{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;font-size:14px}
.file input{display:none}.file strong{display:block;font-size:16px}
label{display:grid;grid-template-columns:100px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:15px}
label.wide{grid-template-columns:100px minmax(0,1fr)}
output{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
input[type=text],select{height:42px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;padding:0 10px;font:inherit;font-size:16px;width:100%}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px}
.note{font-size:13px;color:var(--mute);margin:0}.warn{color:var(--red)}
#tap{position:fixed;inset:0;border:0;border-radius:0;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:grid;place-content:center;gap:6px;text-align:center;color:#1d1d1f;font-weight:600}
#tap strong{font-size:34px;font-weight:800;background:#fff;padding:14px 26px 4px;border-radius:22px 22px 0 0}
#tap span{font-size:16px;color:#55534f;background:#fff;padding:0 26px 16px;border-radius:0 0 22px 22px;margin-top:-6px;box-shadow:0 14px 30px rgba(0,0,0,.18)}
#help{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
#help .card{background:var(--sheet);border-radius:18px;padding:20px;max-width:420px;display:grid;gap:12px;color:var(--ink)}
#help h2{margin:0;font-size:22px;line-height:1.2}#help ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
#hint{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
@media(prefers-reduced-motion:reduce){#tap{position:fixed;inset:0;border:0;border-radius:0;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:grid;place-content:center;gap:6px;text-align:center;color:#1d1d1f;font-weight:600}
#tap strong{font-size:34px;font-weight:800;background:#fff;padding:14px 26px 4px;border-radius:22px 22px 0 0}
#tap span{font-size:16px;color:#55534f;background:#fff;padding:0 26px 16px;border-radius:0 0 22px 22px;margin-top:-6px;box-shadow:0 14px 30px rgba(0,0,0,.18)}
#help{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
#help .card{background:var(--sheet);border-radius:18px;padding:20px;max-width:420px;display:grid;gap:12px;color:var(--ink)}
#help h2{margin:0;font-size:22px;line-height:1.2}#help ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
#hint{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint" hidden></div>
<button id="gear" aria-label="Settings">☰</button>
<button id="tap"><strong>Tap to start</strong><span>Tilt your phone · shake · tap</span></button>
<div id="help" hidden><div class="card"><h2 id="helpTitle"></h2><ol id="helpSteps"></ol><button id="copyLink" hidden>Copy link</button><button id="helpOk" class="red">Play with my finger for now</button></div></div>
<div id="sheet" hidden>
  <div class="top"><div><h1>Ten Tilt</h1><p class="sub">Tilt your phone and the 10s fall that way. Shake for a gust, tap to push. No motion? Drag your finger.</p></div><button id="close" aria-label="Close settings" style="min-height:40px;padding:0 14px">Close</button></div>
  <label class="file"><input type="file" id="fontFile" accept=".otf,.ttf,.woff,font/*,application/octet-stream"><strong id="fontName">Load your font</strong><span>tenyears is built in; load a newer version here</span></label>
  <p class="note warn" id="msg" hidden></p>
  <div class="btns">
    <button id="start" class="red" disabled style="grid-column:1/-1">Start tilting</button>
    <button id="shuffle" disabled>New design</button>
    <button id="reset" disabled>Put back</button>
  </div>
  <label class="wide">Letters <input type="text" id="letters" value="ABCDEFGHIJKLMNOPQRSTUVWXYZ" autocapitalize="characters" spellcheck="false"></label>
  <label>Same letter <input type="range" id="same" min="0" max="100" value="30"><output></output></label>
  <label>Size <input type="range" id="size" min="16" max="240" value="48"><output></output></label>
  <label>Line gap <input type="range" id="gap" min="0" max="100" value="20"><output></output></label>
  <label class="wide">Size mode <select id="sizeMode"><option value="off">All the same</option><option value="line">Random per line</option><option value="pair">Random per 10</option></select></label>
  <label>Random min <input type="range" id="smin" min="16" max="400" value="24"><output></output></label>
  <label>Random max <input type="range" id="smax" min="16" max="400" value="120"><output></output></label>
  <label class="wide">Color mode <select id="colorMode"><option value="off">One color</option><option value="line">Random per line</option><option value="pair">Random per 10</option></select></label>
  <label class="wide">Text color <input type="color" id="color" value="#000000"></label>
  <label>Colors <input type="range" id="ncol" min="1" max="12" value="4"><output></output></label>
  <label class="wide">Background <input type="color" id="bg" value="#ffffff"></label>
  <label class="wide">Random bg <input type="checkbox" id="randBg" style="justify-self:start;width:24px;height:24px"></label>
  <label>Margin <input type="range" id="pm" min="0" max="60" value="12"><output></output></label>
  <label>Heaviness <input type="range" id="heavy" min="1" max="100" value="40"><output></output></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/planck@1.0.6/dist/planck.min.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const ids = ["letters","same","size","gap","sizeMode","smin","smax","colorMode","color","ncol","bg","randBg","pm","heavy"];
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let font = null, seed = 1, page = {W:390, H:844, bg:"#fff"}, letters = [], world = null, bodies = [], tilting = false, live = false;   // live: letters move
const msg=(t,warn)=>{$("msg").hidden=!t;$("msg").classList.toggle("warn",!!warn);$("msg").textContent=t||""};
window.addEventListener("error",e=>msg("Error: "+e.message,true));

// ---------- settings
const val = id => {const e=$(id);return e.type==="checkbox"?e.checked:e.type==="range"?+e.value:e.value};
const showOut=()=>{for(const e of document.querySelectorAll("input[type=range]"))e.nextElementSibling.textContent=e.value};
try{const s=JSON.parse(store.get("ten-tilt-settings")||"{}");for(const id of ids)if(id in s){$(id).type==="checkbox"?$(id).checked=s[id]:$(id).value=s[id]}}catch(e){}
const save=()=>{const s={};for(const id of ids)s[id]=val(id);store.set("ten-tilt-settings",JSON.stringify(s))};
showOut();
const area=()=>({W:innerWidth,H:innerHeight,M:val("pm")});   // the phone's screen

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=r=>"#"+[r(),r(),r()].map(v=>Math.floor(v*256).toString(16).padStart(2,"0")).join("");
const usable=()=>[...new Set(val("letters").toLowerCase().replace(/[^a-zà-ɏ]/g,""))].filter(c=>font.charToGlyph(c).index&&font.charToGlyph(c.toUpperCase()).index);
function dealer(R,low){
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const capDeck=[], lowDeck=[], rc=[], rl=[], keepAway=Math.max(1,Math.min(8,Math.floor(low.length/3)));
  const deal=(deck,bad)=>{for(let k=0;k<2;k++){const i=deck.findIndex(c=>!bad.has(c));if(i>=0)return deck.splice(i,1)[0];deck.push(...shuf([...low]))}return deck.shift()};
  return avoid=>{
    const cap=deal(capDeck,new Set([...rc,(avoid||"").toLowerCase()]));
    const lo=(R()<val("same")/100||low.length===1)?cap:deal(lowDeck,new Set([...rl,cap]));
    rc.push(cap); rl.push(lo); rc.splice(0,rc.length-keepAway); rl.splice(0,rl.length-keepAway);
    return cap.toUpperCase()+lo;
  };
}

// ---------- grid layout (the same rules as the DrawBot poster)
function layout(){
  const R=rng(seed*9973+7), rnd=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
  const {W,H,M}=area(), AW=W-2*M;
  const S=val("size"), sMode=val("sizeMode"), cMode=val("colorMode"), lo_=Math.min(val("smin"),val("smax")), hi_=Math.max(val("smin"),val("smax"));
  const palette=cMode==="off"?[val("color")]:Array.from({length:val("ncol")},()=>hex(R));
  const bg=val("randBg")?hex(R):val("bg"), low=usable();
  if(!low.length)return {W,H,bg,placed:[]};
  const pair=dealer(R,low); let first=" ";
  const bbCache={}, adv=(p,sz)=>font.getAdvanceWidth(p,sz);
  const bb=(p,sz)=>{if(!bbCache[p]){const b=font.getPath(p,0,0,100).getBoundingBox();bbCache[p]=isFinite(b.x1)?b:{x1:0,y1:-70,x2:adv(p,100),y2:0}}const b=bbCache[p],k=sz/100;return{x1:b.x1*k,y1:b.y1*k,x2:b.x2*k,y2:b.y2*k}};
  function line(){
    const s0=sMode==="line"?rnd(lo_,hi_):S, c0=pick(palette), items=[]; let w=0;
    while(items.length<400){
      const it={p:pair(items.length?"":first), sz:sMode==="pair"?rnd(lo_,hi_):s0, c:cMode==="pair"?pick(palette):c0};
      items.push(it); w+=adv(it.p,it.sz);
      if(w>=AW){if(items.length>1){const w2=w-adv(it.p,it.sz);if(AW/w2<w/AW){items.pop();w=w2}}break}
    }
    first=items[0].p[0];
    let pen=0; const parts=items.map(it=>{const r={it,pen,b:bb(it.p,it.sz)};pen+=adv(it.p,it.sz);return r});
    const lx0=parts[0].pen+parts[0].b.x1, L=parts[parts.length-1], s=AW/(L.pen+L.b.x2-lx0);
    return parts.map(({it,pen,b})=>({p:it.p,sz:it.sz*s,c:it.c,x:M+(pen-lx0)*s,
      a:Math.max(0,Math.floor((pen+b.x1-lx0)*s)),b:Math.floor((pen+b.x2-lx0)*s)+1,y0:-b.y2*s,y1:-b.y1*s}));
  }
  const rows=[], row=i=>{while(rows.length<=i)rows.push(line());return rows[i]};
  const NB=Math.floor(AW)+2, PAIR=sMode==="pair";
  function pack(n,g){                     // top half falls down from the top, bottom half rises from the bottom
    const top=new Array(NB).fill(H-M+g), bot=new Array(NB).fill(M-g), out=[], t=Math.ceil(n/2), order=[];
    for(let i=0;i<t;i++)order.push(i); for(let i=n-1;i>=t;i--)order.push(i);
    for(const i of order){
      const down=i<t, sky=down?top:bot, nw=[]; let r=row(i);
      if(!PAIR){const Y0=Math.min(...r.map(q=>q.y0)),Y1=Math.max(...r.map(q=>q.y1)),A=r[0].a,B=r[r.length-1].b;r=r.map(q=>({...q,y0:Y0,y1:Y1,a:A,b:B}))}
      for(const q of r){
        let m=down?Infinity:-Infinity; for(let j=q.a;j<Math.min(q.b,NB);j++)m=down?Math.min(m,sky[j]):Math.max(m,sky[j]);
        const base=down?m-g-q.y1:m+g-q.y0; out.push([q,base]); nw.push([q,down?base+q.y0:base+q.y1]);
      }
      for(const [q,e] of nw)for(let j=q.a;j<Math.min(q.b,NB);j++)sky[j]=e;
    }
    let seam=Infinity; for(let j=0;j<NB;j++)seam=Math.min(seam,top[j]-bot[j]);
    return [out,seam];
  }
  const gap=S*val("gap")/100; let n=1;
  while(n<300&&pack(n+1,gap)[1]>=gap)n++;
  let lo=gap, hi=gap+Math.max(0,pack(n,gap)[1]-gap);
  for(let i=0;i<25;i++){const mid=(lo+hi)/2;if(pack(n,mid)[1]>=mid)lo=mid;else hi=mid}
  return {W,H,bg,placed:pack(n,lo)[0]};
}
function buildLetters(L){                  // one shape per letter, from the real outline
  const upm=font.unitsPerEm, out=[];
  for(const [q,base] of L.placed){
    const gl=font.stringToGlyphs(q.p); let gx=q.x; const by=L.H-base;
    gl.forEach((g,i)=>{
      const path=g.getPath(gx,by,q.sz);
      if(path.commands.length)out.push({path,p2d:new Path2D(path.toPathData(2)),c:q.c,body:null});
      gx+=g.advanceWidth*q.sz/upm+(gl[i+1]?font.getKerningValue(g,gl[i+1])*q.sz/upm:0);
    });
  }
  return out;
}


let S=30;                                  // physics scale: pixels per metre (set from the screen width)
function makeBody(l,world){                // the letter drawn on a small grid; filled squares become its shape
  const bx=l.path.getBoundingBox(); if(!isFinite(bx.x1))return null;
  const w=bx.x2-bx.x1, h=bx.y2-bx.y1, cell=Math.max(.8,Math.max(w,h)/20);
  const cols=Math.ceil(w/cell)+2, rows=Math.ceil(h/cell)+2;
  const c=makeBody.c||(makeBody.c=document.createElement("canvas")); c.width=cols; c.height=rows;
  const x=c.getContext("2d",{willReadFrequently:true}); x.clearRect(0,0,cols,rows);
  x.setTransform(1/cell,0,0,1/cell,1-bx.x1/cell,1-bx.y1/cell); x.fill(l.p2d);
  const d=x.getImageData(0,0,cols,rows).data, on=(i,j)=>d[(j*cols+i)*4+3]>25;
  const ox=(bx.x1+bx.x2)/2, oy=(bx.y1+bx.y2)/2;
  const body=world.createBody({type:"dynamic",position:planck.Vec2(ox/S,oy/S),linearDamping:.1,angularDamping:.8});
  const fix={density:1,friction:.9,restitution:0}; const open={}; let n=0;
  const add=(i0,i1,j0,j1)=>{const x0=bx.x1+(i0-1)*cell,x1=bx.x1+(i1-1)*cell,y0=bx.y1+(j0-1)*cell,y1=bx.y1+(j1-1)*cell;
    try{body.createFixture(planck.Box((x1-x0)/2/S,(y1-y0)/2/S,planck.Vec2(((x0+x1)/2-ox)/S,((y0+y1)/2-oy)/S)),fix);n++}catch(e){}};
  for(let j=0;j<=rows;j++){
    const runs={};
    if(j<rows)for(let i=0;i<cols;i++)if(on(i,j)){let k=i;while(k+1<cols&&on(k+1,j))k++;runs[i+":"+(k+1)]=1;i=k}
    for(const key in open)if(!runs[key]){const [i0,i1]=key.split(":").map(Number);add(i0,i1,open[key],j);delete open[key]}
    for(const key in runs)if(!(key in open))open[key]=j;
  }
  if(!n)body.createFixture(planck.Box(Math.max(.05,w/2/S),Math.max(.05,h/2/S)),fix);
  l.o={x:ox,y:oy}; return body;
}


// ---------- the world: walls on the margins; gravity follows the phone
const G=30;                                // full gravity, metres per second squared
function makeWorld(){
  world=planck.World({gravity:planck.Vec2(0,G)});
  const {W,H}=page, M=val("pm"), ground=world.createBody();
  const box=(x0,y0,x1,y1)=>ground.createFixture(planck.Box((x1-x0)/2/S,(y1-y0)/2/S,planck.Vec2((x0+x1)/2/S,(y0+y1)/2/S)),{friction:.9});
  box(-W,H-M,2*W,H*3); box(-W,-H*3,M,H*3); box(W-M,-H*3,2*W,H*3); box(-W,-H*3,2*W,M);   // floor, walls, ceiling
  const heavy=val("heavy")/100;
  bodies=letters.map(l=>{let b=null;try{b=makeBody(l,world)}catch(e){}
    if(b){b.setLinearDamping(.05+heavy*.6);b.setAngularDamping(.4+heavy*2)}l.body=b;return b});
}
let gravity={x:0,y:1};                     // direction and strength, 1 = phone held straight up
function setGravity(x,y){
  if(!world)return;
  const moved=Math.hypot(x-gravity.x,y-gravity.y)>.02; gravity={x,y};
  world.setGravity(planck.Vec2(x*G,y*G));
  if(moved)for(const b of bodies)b&&b.setAwake(true);   // sleeping letters wake up when you tilt
}
function push(px,py,power){                // a blast from a point: tap or shake
  for(const b of bodies){
    if(!b)continue; const p=b.getPosition(), dx=p.x*S-px, dy=p.y*S-py, d=Math.max(30,Math.hypot(dx,dy));
    const f=b.getMass()*power*Math.min(1,(page.W*.6)/d);
    b.applyLinearImpulse(planck.Vec2(dx/d*f,dy/d*f),b.getWorldCenter(),true);
    b.applyAngularImpulse(b.getInertia()*(Math.random()-.5)*power*.1,true);
  }
}

// ---------- phone motion
const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let lastShake=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x===null)return;
  let x=a.x/9.81, y=-a.y/9.81;             // gravity in screen directions (iPhone sign; others flipped below)
  if(!iOS){x=-x;y=-y}
  const ang=((screen.orientation&&screen.orientation.angle)??window.orientation??0)*Math.PI/180;   // follow a rotated screen
  const rx=x*Math.cos(ang)+y*Math.sin(ang), ry=-x*Math.sin(ang)+y*Math.cos(ang);
  setGravity(Math.max(-1.5,Math.min(1.5,rx)),Math.max(-1.5,Math.min(1.5,ry)));
  const j=e.acceleration;                  // shake: a hard jolt without gravity
  if(j&&j.x!==null&&Math.hypot(j.x,j.y,j.z)>14&&performance.now()-lastShake>500){lastShake=performance.now();push(page.W/2,page.H*1.1,9)}
}
const ua=navigator.userAgent;
const homeScreen=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;   // opened from a Home Screen icon
const inApp=!homeScreen&&(/FBAN|FBAV|Instagram|Line\/|GSA\/|WhatsApp|Snapchat|MicroMessenger|Claude/i.test(ua)||(iOS&&!/Safari\//.test(ua)));   // a browser inside another app
const PROBLEMS={
  inApp:["Open this page in Safari",["Tap <b>Copy link</b> below.","Open the <b>Safari</b> app, tap the address bar, paste and go.","Tap <b>Tap to start</b> and then <b>Allow</b>."]],
  https:["The page needs an https:// address",["The iPhone only shares motion with pages online, not with a file opened from Files.","Put the page online (Netlify Drop) and open its <b>https://</b> link in Safari."]],

function problem(kind){
  const [t,steps]=PROBLEMS[kind]; $("helpTitle").textContent=t;
  $("helpSteps").innerHTML=steps.map(x=>"<li>"+x+"</li>").join(""); $("help").hidden=false;
  $("copyLink").hidden=kind!=="inApp"||!/^https:/.test(location.href);
}
async function startTilt(){
  $("tap").hidden=true; live=true;
  try{
    if(typeof DeviceMotionEvent==="undefined")return problem("none");
    if(!window.isSecureContext)return problem(inApp?"inApp":"https");
    if(typeof DeviceMotionEvent.requestPermission==="function"){
      let r="denied"; try{r=await DeviceMotionEvent.requestPermission()}catch(e){}   // iPhone asks once
      if(r!=="granted")return problem(inApp?"inApp":"denied");
    }
    window.addEventListener("devicemotion",onMotion);
    tilting=true; $("start").textContent="Tilting ✓"; closeSheet();
    hint("Tilt the phone · shake · tap");
  }catch(e){msg("Couldn't start motion: "+e.message,true)}
}
$("tap").addEventListener("click",startTilt);
$("copyLink").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(location.href);$("copyLink").textContent="Copied ✓ Now paste it in Safari"}
  catch(e){$("copyLink").textContent=location.href}   // can't copy: show the address to type instead
});

// ---------- no phone? arrow keys or drag with the mouse to tilt (for testing on a computer)
const keys={};
addEventListener("keydown",e=>{keys[e.key]=true;keyTilt()}); addEventListener("keyup",e=>{keys[e.key]=false;keyTilt()});
function keyTilt(){if(tilting)return;live=true;const x=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),y=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);if(x||y)setGravity(x/Math.hypot(x,y),y/Math.hypot(x,y))}

// ---------- tap to push
let down=null;
cv.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener("pointermove",e=>{   // without motion: gravity follows your finger while you drag
  if(!down||tilting)return; const dx=e.clientX-down.x,dy=e.clientY-down.y,d=Math.hypot(dx,dy);
  if(d>12){live=true;setGravity(dx/d,dy/d)}
});
cv.addEventListener("pointerup",e=>{
  if(!down)return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);
  live=true;
  if(moved<12)push(e.clientX,e.clientY,5);                      // a tap pushes letters away from your finger
  else if(!tilting){const dx=e.clientX-down.x,dy=e.clientY-down.y,d=Math.hypot(dx,dy);setGravity(dx/d,dy/d)}   // a drag sets the tilt on a computer
  down=null;
});

// ---------- run + draw
let last=0, acc=0;
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000); last=now; acc+=dt;
  while(acc>=1/60){if(world&&live)world.step(1/60,8,4);acc-=1/60}   // the design holds still until you start
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.fillStyle=page.bg; ctx.fillRect(0,0,page.W,page.H);
  for(const l of letters){
    ctx.fillStyle=l.c;
    if(l.body){const p=l.body.getPosition();ctx.save();ctx.translate(p.x*S,p.y*S);ctx.rotate(l.body.getAngle());ctx.translate(-l.o.x,-l.o.y);ctx.fill(l.p2d);ctx.restore()}
    else ctx.fill(l.p2d);
  }
  requestAnimationFrame(frame);
}
function rebuild(){
  if(!font)return; save();
  const {W,H}=area(); S=W/14;            // physics scale from the screen width
  cv.width=Math.round(W*devicePixelRatio); cv.height=Math.round(H*devicePixelRatio);
  const L=layout(); page={W:L.W,H:L.H,bg:L.bg}; letters=buildLetters(L);
  document.body.style.background=page.bg; document.querySelector('meta[name=theme-color]').content=page.bg;
  makeWorld(); setGravity(gravity.x,gravity.y); live=tilting;   // a new design holds still until you tilt (or start)
}

function useFont(buf,name){
  try{font=opentype.parse(buf)}catch(e){$("fontName").textContent="Could not read that font";return}
  $("fontName").textContent=name; for(const b of ["start","shuffle","reset"])$(b).disabled=false;
  const miss=[...new Set(val("letters"))].flatMap(c=>[c.toUpperCase(),c.toLowerCase()]).filter(c=>/\p{L}/u.test(c)&&!font.charToGlyph(c).index);
  msg(miss.length?"Not in the font yet, skipped: "+[...new Set(miss)].join(" "):"",true);

}

  const f=e.target.files[0]; if(!f)return; const buf=await f.arrayBuffer();
  try{let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));store.set("ten-tilt-font",JSON.stringify({name:f.name,data:btoa(s)}))}catch(e){}
  useFont(buf,f.name);
});
const bytes=b64=>{const b=atob(b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
let stored=null; try{stored=JSON.parse(store.get("ten-tilt-font")||"null")}catch(e){}
if(stored)useFont(bytes(stored.data),stored.name); else useFont(bytes(BUILTIN),"tenyears-Regular.otf (built in)");

// ---------- controls
for(const id of ids)$(id).addEventListener("input",()=>{showOut();rebuild()});
$("start").addEventListener("click",startTilt);
$("shuffle").addEventListener("click",()=>{seed++;rebuild()});
$("reset").addEventListener("click",rebuild);
let rt=0; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(rebuild,250)});
requestAnimationFrame(frame);
}
</script>
