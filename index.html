<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<title>Ten Tilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: an instrument, not an app: calm, exact, a little playful
   IDEA: a pocket synth panel (Teenage Engineering / Dieter Rams): keys with indicator lights, thin faders
   PICTURE: the full-screen pile of 10s; the panel slides over it only when asked for
   COLOUR and TYPE: warm off-white panel, black ink, one orange signal colour; Inter Tight + a mono for values
   LAYOUT: full-bleed canvas; bottom panel in a 4-column grid of square keys and fader rows */
:root{--panel:#efeee9;--key:#fbfaf7;--ink:#141413;--mute:#8a8882;--line:#d9d7d0;--sig:#ff4f00}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#fff;color:var(--ink);font:15px/1.35 "Inter Tight",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.02em}

/* menu button */
#gear{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#gear i{display:block;width:16px;height:2px;background:var(--panel);box-shadow:0 -5px 0 var(--panel),0 5px 0 var(--panel)}

/* panel */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18);display:grid;gap:14px;touch-action:pan-y;-webkit-user-select:auto;user-select:auto}
.head{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px}.brand b{font-size:20px;font-weight:700;letter-spacing:-.01em}.brand span{color:var(--mute)}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--key);font-size:18px;line-height:1}
.sec{display:grid;gap:8px}.sec>.mono{color:var(--mute)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.key{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--key);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:9px;font-size:13px;font-weight:500;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.key:active{transform:translateY(1px)}
.key .led{position:absolute;top:9px;left:9px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.key[aria-pressed=true] .led{background:var(--sig);box-shadow:0 0 6px var(--sig)}
.key.go{background:var(--sig);border-color:var(--sig);color:#fff}.key.go .led{background:#fff}
.key.ink{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.wide2{grid-column:span 2;aspect-ratio:auto;min-height:56px}
.fader{display:grid;grid-template-columns:64px minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:13px;font-weight:500}
.fader output{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-10px;border-radius:3px;background:var(--key);border:1.5px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:20px;border-radius:3px;background:var(--key);border:1.5px solid var(--ink)}
.seg{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:13px;font-weight:500}
.seg button{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--key);font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.swatches{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:13px;font-weight:500}
.sw{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--key);display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12px;position:relative;overflow:hidden}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chip{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
.letters{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.letters input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--key);padding:0 10px;font:500 15px "JetBrains Mono",monospace;letter-spacing:.04em;width:100%}
.letters button{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--key);font-weight:500}
.file{border:1px dashed var(--mute);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.file input{display:none}.file span{color:var(--mute)}
.msg{margin:0;font-size:13px;color:var(--sig)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0}

/* start + help + hint */
#tap{position:fixed;inset:0;border:0;background:rgba(255,255,255,.5);display:grid;place-items:center;padding:24px}
#tap .card{background:var(--panel);border-radius:16px;padding:22px 26px;display:grid;gap:6px;text-align:left;box-shadow:0 12px 34px rgba(0,0,0,.2);min-width:240px}
#tap .card b{font-size:28px;font-weight:700;letter-spacing:-.01em}#tap .card .mono{color:var(--mute)}
#tap .card .led{width:9px;height:9px;border-radius:50%;background:var(--sig);box-shadow:0 0 8px var(--sig);margin-bottom:6px}
#help{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
#help .card{background:var(--panel);border-radius:16px;padding:20px;max-width:420px;display:grid;gap:12px}
#help h2{margin:0;font-size:20px;line-height:1.2}#help ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
#help button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--key);font-weight:500}
#help button.go{background:var(--sig);border-color:var(--sig);color:#fff}
#hint{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:20px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
@media(prefers-reduced-motion:reduce){#hint{transition:none}}
#desk{position:fixed;inset:0;display:grid;place-items:center;background:var(--panel);padding:24px;touch-action:auto}
#desk .card{background:var(--key);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:380px;display:grid;gap:12px;justify-items:start}
#desk b{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}#desk p{margin:0;color:var(--mute)}
#desk .led{width:9px;height:9px;border-radius:50%;background:var(--sig);box-shadow:0 0 8px var(--sig)}
#qr{width:200px;height:200px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px}#qr svg{width:100%;height:100%;display:block}
#desk .mono{color:var(--mute);word-break:break-all}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint" class="mono" hidden></div>
<button id="gear" aria-label="Menu"><i></i></button>
<button id="tap"><span class="card"><span class="led"></span><b>Tap to start</b><span class="mono">tilt · shake · tap · sound</span></span></button>
<div id="help" hidden><div class="card"><h2 id="helpTitle"></h2><ol id="helpSteps"></ol><button id="copyLink" hidden>Copy link</button><button id="helpOk" class="go">Play with my finger for now</button></div></div>

<div id="sheet" hidden>
  <div class="head"><div class="brand"><b>Ten Tilt</b><span class="mono">10 · 01</span></div><button class="x" id="close" aria-label="Close">×</button></div>

  <div class="sec"><span class="mono">play</span>
    <div class="keys">
      <button class="key" id="kTilt" aria-pressed="true"><span class="led"></span>Tilt</button>
      <button class="key" id="kShake" aria-pressed="true"><span class="led"></span>Shake</button>
      <button class="key" id="kTap" aria-pressed="true"><span class="led"></span>Tap</button>
      <button class="key" id="kSound" aria-pressed="false"><span class="led"></span>Sound</button>
    </div>
    <label class="fader">Sense <input type="range" id="sens" min="1" max="100" value="60"><output class="mono"></output></label>
    <label class="fader">Heavy <input type="range" id="heavy" min="1" max="100" value="40"><output class="mono"></output></label>
    <p class="msg" id="msg" hidden></p>
  </div>
  <hr>
  <div class="sec"><span class="mono">layout</span>
    <label class="fader">Size <input type="range" id="size" min="10" max="120" value="28"><output class="mono"></output></label>
    <label class="fader">Gap <input type="range" id="gap" min="0" max="100" value="20"><output class="mono"></output></label>
    <label class="fader">Same <input type="range" id="same" min="0" max="100" value="30"><output class="mono"></output></label>
    <label class="fader">Margin <input type="range" id="pm" min="0" max="60" value="12"><output class="mono"></output></label>
    <div class="seg" data-for="pieces">Pieces <button data-v="letters">Letters</button><button data-v="pairs">Pairs</button><span class="mono" style="color:var(--mute)">pairs = faster</span></div>
    <div class="seg" data-for="sizeMode">Sizes <button data-v="off">Fixed</button><button data-v="line">Line</button><button data-v="pair">Each 10</button></div>
    <label class="fader">Min <input type="range" id="smin" min="10" max="200" value="14"><output class="mono"></output></label>
    <label class="fader">Max <input type="range" id="smax" min="10" max="200" value="60"><output class="mono"></output></label>
  </div>
  <hr>
  <div class="sec"><span class="mono">colour</span>
    <div class="seg" data-for="colorMode">Mode <button data-v="off">One</button><button data-v="line">Line</button><button data-v="pair">Each 10</button></div>
    <div class="swatches">Pick
      <label class="sw"><span class="chip" id="chipText"></span>Text<input type="color" id="color" value="#000000"></label>
      <label class="sw"><span class="chip" id="chipBg"></span>Back<input type="color" id="bg" value="#ffffff"></label>
      <button class="sw" id="kRandBg" aria-pressed="false"><span class="chip" id="chipRand" style="background:conic-gradient(#ff4f00,#ffd400,#2fb36b,#2f6bff,#ff4f00)"></span>Random</button>
    </div>
    <label class="fader">Colours <input type="range" id="ncol" min="1" max="12" value="4"><output class="mono"></output></label>
  </div>
  <hr>
  <div class="sec"><span class="mono">letters</span>
    <div class="letters"><input type="text" id="letters" value="ABCDEFGHIJKLMNOPQRSTUVWXYZ" autocapitalize="characters" spellcheck="false" aria-label="Letters"><button id="allLetters">A–Z</button></div>
    <label class="file"><input type="file" id="fontFile" accept=".otf,.ttf,.woff,font/*,application/octet-stream"><strong id="fontName">tenyears</strong><span>load font</span></label>
  </div>
  <div class="keys">
    <button class="key wide2 ink" id="shuffle">New</button>
    <button class="key wide2" id="reset">Put back</button>
  </div>
</div>
<input type="hidden" id="pieces" value="letters"><input type="hidden" id="sizeMode" value="off"><input type="hidden" id="colorMode" value="off"><input type="checkbox" id="randBg" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/planck@1.0.6/dist/planck.min.js"></script>
<script>
const isPhone=matchMedia("(pointer: coarse)").matches&&Math.min(screen.width,screen.height)<600;   // touch screen, phone sized
if(!isPhone){                              // computers and tablets get a QR code to open it on a phone
  document.body.innerHTML='<div id="desk"><div class="card"><span class="led"></span><b>Ten Tilt is made for phones</b><p>Scan with your phone camera, then open the link in Safari.</p><div id="qr"></div><span class="mono" id="url"></span></div></div>';
  document.getElementById("url").textContent=location.href.replace(/^https?:\/\//,"");
  try{const q=qrcode(0,"M");q.addData(location.href);q.make();document.getElementById("qr").innerHTML=q.createSvgTag({cellSize:5,margin:0,scalable:true})}catch(e){}
}else{
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const ids = ["letters","same","size","gap","pieces","sizeMode","smin","smax","colorMode","color","ncol","bg","randBg","pm","heavy","sens"];
const play = {tilt:true, shake:true, tap:true, sound:false};   // which interactions are on
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let font = null, seed = 1, page = {W:390, H:844, bg:"#fff"}, letters = [], world = null, bodies = [], tilting = false, live = false;
const msg=t=>{$("msg").hidden=!t;$("msg").textContent=t||""};
window.addEventListener("error",e=>msg("Error: "+e.message));

// ---------- settings
const val = id => {const e=$(id);return e.type==="checkbox"?e.checked:e.type==="range"?+e.value:e.value};
function showOut(){
  for(const e of document.querySelectorAll("input[type=range]"))e.nextElementSibling.textContent=e.value;
  for(const g of document.querySelectorAll(".seg"))for(const b of g.querySelectorAll("button"))b.setAttribute("aria-pressed",b.dataset.v===val(g.dataset.for));
  $("chipText").style.background=val("color"); $("chipBg").style.background=val("bg"); $("kRandBg").setAttribute("aria-pressed",val("randBg"));
  for(const k of ["tilt","shake","tap","sound"])$("k"+k[0].toUpperCase()+k.slice(1)).setAttribute("aria-pressed",play[k]);
}
try{const s=JSON.parse(store.get("ten-tilt-settings-2")||"{}");for(const id of ids)if(id in s){$(id).type==="checkbox"?$(id).checked=s[id]:$(id).value=s[id]}
  if(s.play)Object.assign(play,s.play,{sound:false})}catch(e){}       // the microphone always starts off
const save=()=>{const s={play};for(const id of ids)s[id]=val(id);store.set("ten-tilt-settings-2",JSON.stringify(s))};
showOut();
const area=()=>({W:innerWidth,H:innerHeight,M:val("pm")});   // the phone's screen

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=r=>"#"+[r(),r(),r()].map(v=>Math.floor(v*256).toString(16).padStart(2,"0")).join("");
const usable=()=>[...new Set(val("letters").toLowerCase().replace(/[^a-zà-ɏ]/g,""))].filter(c=>font.charToGlyph(c).index&&font.charToGlyph(c.toUpperCase()).index);
function dealer(R,low){
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const capDeck=[], lowDeck=[], rc=[], rl=[], keepAway=Math.max(1,Math.min(8,Math.floor(low.length/3)));
  const deal=(deck,bad)=>{for(let k=0;k<2;k++){const i=deck.findIndex(c=>!bad.has(c));if(i>=0)return deck.splice(i,1)[0];deck.push(...shuf([...low]))}return deck.shift()};
  return avoid=>{
    const cap=deal(capDeck,new Set([...rc,(avoid||"").toLowerCase()]));
    const lo=(R()<val("same")/100||low.length===1)?cap:deal(lowDeck,new Set([...rl,cap]));
    rc.push(cap); rl.push(lo); rc.splice(0,rc.length-keepAway); rl.splice(0,rl.length-keepAway);
    return cap.toUpperCase()+lo;
  };
}

// ---------- grid layout (the same rules as the DrawBot poster)
function layout(){
  const R=rng(seed*9973+7), rnd=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
  const {W,H,M}=area(), AW=W-2*M;
  const S=val("size"), sMode=val("sizeMode"), cMode=val("colorMode"), lo_=Math.min(val("smin"),val("smax")), hi_=Math.max(val("smin"),val("smax"));
  const palette=cMode==="off"?[val("color")]:Array.from({length:val("ncol")},()=>hex(R));
  const bg=val("randBg")?hex(R):val("bg"), low=usable();
  if(!low.length)return {W,H,bg,placed:[]};
  const pair=dealer(R,low); let first=" ";
  const bbCache={}, adv=(p,sz)=>font.getAdvanceWidth(p,sz);
  const bb=(p,sz)=>{if(!bbCache[p]){const b=font.getPath(p,0,0,100).getBoundingBox();bbCache[p]=isFinite(b.x1)?b:{x1:0,y1:-70,x2:adv(p,100),y2:0}}const b=bbCache[p],k=sz/100;return{x1:b.x1*k,y1:b.y1*k,x2:b.x2*k,y2:b.y2*k}};
  function line(){
    const s0=sMode==="line"?rnd(lo_,hi_):S, c0=pick(palette), items=[]; let w=0;
    while(items.length<400){
      const it={p:pair(items.length?"":first), sz:sMode==="pair"?rnd(lo_,hi_):s0, c:cMode==="pair"?pick(palette):c0};
      items.push(it); w+=adv(it.p,it.sz);
      if(w>=AW){if(items.length>1){const w2=w-adv(it.p,it.sz);if(AW/w2<w/AW){items.pop();w=w2}}break}
    }
    first=items[0].p[0];
    let pen=0; const parts=items.map(it=>{const r={it,pen,b:bb(it.p,it.sz)};pen+=adv(it.p,it.sz);return r});
    const lx0=parts[0].pen+parts[0].b.x1, L=parts[parts.length-1], s=AW/(L.pen+L.b.x2-lx0);
    return parts.map(({it,pen,b})=>({p:it.p,sz:it.sz*s,c:it.c,x:M+(pen-lx0)*s,
      a:Math.max(0,Math.floor((pen+b.x1-lx0)*s)),b:Math.floor((pen+b.x2-lx0)*s)+1,y0:-b.y2*s,y1:-b.y1*s}));
  }
  const rows=[], row=i=>{while(rows.length<=i)rows.push(line());return rows[i]};
  const NB=Math.floor(AW)+2, PAIR=sMode==="pair";
  function pack(n,g){                     // top half falls down from the top, bottom half rises from the bottom
    const top=new Array(NB).fill(H-M+g), bot=new Array(NB).fill(M-g), out=[], t=Math.ceil(n/2), order=[];
    for(let i=0;i<t;i++)order.push(i); for(let i=n-1;i>=t;i--)order.push(i);
    for(const i of order){
      const down=i<t, sky=down?top:bot, nw=[]; let r=row(i);
      if(!PAIR){const Y0=Math.min(...r.map(q=>q.y0)),Y1=Math.max(...r.map(q=>q.y1)),A=r[0].a,B=r[r.length-1].b;r=r.map(q=>({...q,y0:Y0,y1:Y1,a:A,b:B}))}
      for(const q of r){
        let m=down?Infinity:-Infinity; for(let j=q.a;j<Math.min(q.b,NB);j++)m=down?Math.min(m,sky[j]):Math.max(m,sky[j]);
        const base=down?m-g-q.y1:m+g-q.y0; out.push([q,base]); nw.push([q,down?base+q.y0:base+q.y1]);
      }
      for(const [q,e] of nw)for(let j=q.a;j<Math.min(q.b,NB);j++)sky[j]=e;
    }
    let seam=Infinity; for(let j=0;j<NB;j++)seam=Math.min(seam,top[j]-bot[j]);
    return [out,seam];
  }
  const gap=S*val("gap")/100; let n=1;
  while(n<300&&pack(n+1,gap)[1]>=gap)n++;
  let lo=gap, hi=gap+Math.max(0,pack(n,gap)[1]-gap);
  for(let i=0;i<25;i++){const mid=(lo+hi)/2;if(pack(n,mid)[1]>=mid)lo=mid;else hi=mid}
  return {W,H,bg,placed:pack(n,lo)[0]};
}
function buildLetters(L){                  // one shape per letter, from the real outline
  const upm=font.unitsPerEm, out=[];
  for(const [q,base] of L.placed){
    const gl=font.stringToGlyphs(q.p); let gx=q.x; const by=L.H-base;
    if(val("pieces")==="pairs"){         // the 1 and the 0 stay together as one piece: half the pieces, much faster
      const path=font.getPath(q.p,gx,by,q.sz);
      if(path.commands.length)out.push({path,p2d:new Path2D(path.toPathData(2)),c:q.c,body:null});
      continue;
    }
    gl.forEach((g,i)=>{
      const path=g.getPath(gx,by,q.sz);
      if(path.commands.length)out.push({path,p2d:new Path2D(path.toPathData(2)),c:q.c,body:null});
      gx+=g.advanceWidth*q.sz/upm+(gl[i+1]?font.getKerningValue(g,gl[i+1])*q.sz/upm:0);
    });
  }
  return out;
}


let S=30;                                  // physics scale: pixels per metre (set from the screen width)
function makeBody(l,world){                // the letter drawn on a small grid; filled squares become its shape
  const bx=l.path.getBoundingBox(); if(!isFinite(bx.x1))return null;
  const w=bx.x2-bx.x1, h=bx.y2-bx.y1, cell=Math.max(w,h)/Math.max(3,Math.min(6,Math.max(w,h)/6));   // small letters get a coarser, faster shape
  const cols=Math.ceil(w/cell)+2, rows=Math.ceil(h/cell)+2;
  const c=makeBody.c||(makeBody.c=document.createElement("canvas")); c.width=cols; c.height=rows;
  const x=c.getContext("2d",{willReadFrequently:true}); x.clearRect(0,0,cols,rows);
  x.setTransform(1/cell,0,0,1/cell,1-bx.x1/cell,1-bx.y1/cell); x.fill(l.p2d);
  const d=x.getImageData(0,0,cols,rows).data, on=(i,j)=>d[(j*cols+i)*4+3]>25;
  const ox=(bx.x1+bx.x2)/2, oy=(bx.y1+bx.y2)/2;
  const body=world.createBody({type:"dynamic",position:planck.Vec2(ox/S,oy/S),linearDamping:.1,angularDamping:.8});
  const fix={density:1,friction:.9,restitution:0}; const open={}; let n=0;
  const add=(i0,i1,j0,j1)=>{const x0=bx.x1+(i0-1)*cell,x1=bx.x1+(i1-1)*cell,y0=bx.y1+(j0-1)*cell,y1=bx.y1+(j1-1)*cell;
    try{body.createFixture(planck.Box((x1-x0)/2/S,(y1-y0)/2/S,planck.Vec2(((x0+x1)/2-ox)/S,((y0+y1)/2-oy)/S)),fix);n++}catch(e){}};
  for(let j=0;j<=rows;j++){
    const runs={};
    if(j<rows)for(let i=0;i<cols;i++)if(on(i,j)){let k=i;while(k+1<cols&&on(k+1,j))k++;runs[i+":"+(k+1)]=1;i=k}
    for(const key in open)if(!runs[key]){const [i0,i1]=key.split(":").map(Number);add(i0,i1,open[key],j);delete open[key]}
    for(const key in runs)if(!(key in open))open[key]=j;
  }
  if(!n)body.createFixture(planck.Box(Math.max(.05,w/2/S),Math.max(.05,h/2/S)),fix);
  l.o={x:ox,y:oy}; return body;
}


// ---------- the world: walls on the margins; gravity follows the phone
const G=30;
function makeWorld(){
  world=planck.World({gravity:planck.Vec2(gravity.x*G,gravity.y*G)});
  const {W,H}=page, M=val("pm"), ground=world.createBody();
  const box=(x0,y0,x1,y1)=>ground.createFixture(planck.Box((x1-x0)/2/S,(y1-y0)/2/S,planck.Vec2((x0+x1)/2/S,(y0+y1)/2/S)),{friction:.9});
  box(-W,H-M,2*W,H*3); box(-W,-H*3,M,H*3); box(W-M,-H*3,2*W,H*3); box(-W,-H*3,2*W,M);   // floor, walls, ceiling
  const heavy=val("heavy")/100;
  bodies=letters.map(l=>{let b=null;try{b=makeBody(l,world)}catch(e){}
    if(b){b.setLinearDamping(.05+heavy*.6);b.setAngularDamping(.4+heavy*2)}l.body=b;return b});
}
let gravity={x:0,y:1};                     // 1 = phone held straight up
function setGravity(x,y){
  if(!world)return;
  const moved=Math.hypot(x-gravity.x,y-gravity.y)>.02; gravity={x,y};
  world.setGravity(planck.Vec2(x*G,y*G));
  if(moved)for(const b of bodies)b&&b.setAwake(true);
}
function push(px,py,power){                // a blast from a point: tap or shake
  for(const b of bodies){
    if(!b)continue; const p=b.getPosition(), dx=p.x*S-px, dy=p.y*S-py, d=Math.max(30,Math.hypot(dx,dy));
    const f=b.getMass()*power*Math.min(1,(page.W*.6)/d);
    b.applyLinearImpulse(planck.Vec2(dx/d*f,dy/d*f),b.getWorldCenter(),true);
    b.applyAngularImpulse(b.getInertia()*(Math.random()-.5)*power*.1,true);
  }
}
function jump(strength){                   // a beat: every letter jumps against gravity, some higher than others
  const g=Math.hypot(gravity.x,gravity.y)||1, ux=-gravity.x/g, uy=-(gravity.y||1)/g;
  for(const b of bodies){
    if(!b)continue; const f=b.getMass()*strength*(.35+Math.random()*.9);
    b.applyLinearImpulse(planck.Vec2(ux*f+(Math.random()-.5)*f*.4,uy*f),b.getWorldCenter(),true);
    b.applyAngularImpulse(b.getInertia()*(Math.random()-.5)*strength*.15,true);
  }
}

// ---------- phone motion
const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let lastShake=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x===null)return;
  let x=a.x/9.81, y=-a.y/9.81; if(!iOS){x=-x;y=-y}
  const ang=((screen.orientation&&screen.orientation.angle)??window.orientation??0)*Math.PI/180;
  const rx=x*Math.cos(ang)+y*Math.sin(ang), ry=-x*Math.sin(ang)+y*Math.cos(ang);
  if(play.tilt)setGravity(Math.max(-1.5,Math.min(1.5,rx)),Math.max(-1.5,Math.min(1.5,ry)));
  const j=e.acceleration;
  if(play.shake&&j&&j.x!==null&&Math.hypot(j.x,j.y,j.z)>14&&performance.now()-lastShake>500){lastShake=performance.now();push(page.W/2,page.H*1.1,9)}
}
const ua=navigator.userAgent;
const homeScreen=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const inApp=!homeScreen&&(/FBAN|FBAV|Instagram|Line\/|GSA\/|WhatsApp|Snapchat|MicroMessenger|Claude/i.test(ua)||(iOS&&!/Safari\//.test(ua)));
const PROBLEMS={
  inApp:["Open this page in Safari",["Tap <b>Copy link</b> below.","Open the <b>Safari</b> app, tap the address bar, paste and go.","Tap <b>Tap to start</b> and then <b>Allow</b>."]],
  https:["The page needs an https:// address",["The iPhone only shares motion with pages online, not with a file opened from Files.","Open the page's <b>https://</b> link in Safari."]],
  denied:["Motion access was turned down",["Open iPhone <b>Settings → Apps → Safari → Advanced → Website Data</b>.","Search for this site (e.g. <b>github.io</b>), swipe left and delete it.","Come back, reload, tap <b>Tap to start</b> and choose <b>Allow</b>."]],
  none:["No motion sensors here",["Drag your finger across the screen: gravity follows your finger."]]};
function problem(kind){
  const [t,steps]=PROBLEMS[kind]; $("helpTitle").textContent=t;
  $("helpSteps").innerHTML=steps.map(x=>"<li>"+x+"</li>").join(""); $("help").hidden=false;
  $("copyLink").hidden=kind!=="inApp"||!/^https:/.test(location.href);
}
async function startTilt(){
  $("tap").hidden=true; live=true;
  if(typeof DeviceMotionEvent==="undefined")return problem("none");
  if(!window.isSecureContext)return problem(inApp?"inApp":"https");
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    let r="denied"; try{r=await DeviceMotionEvent.requestPermission()}catch(e){}
    if(r!=="granted")return problem(inApp?"inApp":"denied");
  }
  window.addEventListener("devicemotion",onMotion);
  tilting=true; $("gear").hidden=true;   // clean full screen
  hint("tilt · shake · tap · double-tap for menu");
}
$("tap").addEventListener("click",startTilt);
$("copyLink").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);$("copyLink").textContent="Copied ✓ Now paste it in Safari"}catch(e){$("copyLink").textContent=location.href}});
$("helpOk").addEventListener("click",()=>{$("help").hidden=true;$("gear").hidden=true;hint("drag to tilt · double-tap for menu")});

// ---------- sound: letters jump on the beat (mostly the bass). Listened to on the phone only, never recorded.
let audio=null;
async function soundOn(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)(); await ac.resume();
    const an=ac.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.15;
    ac.createMediaStreamSource(stream).connect(an);
    audio={ac,an,stream,data:new Uint8Array(an.frequencyBinCount),avg:0,last:0}; return true;
  }catch(e){msg("Microphone not available: "+(e.name==="NotAllowedError"?"access was turned down in Safari settings.":e.message));return false}
}
function soundOff(){if(audio){audio.stream.getTracks().forEach(t=>t.stop());audio.ac.close();audio=null}}
function listen(now){
  if(!audio)return;
  const {an,data}=audio; an.getByteFrequencyData(data);
  const hz=audio.ac.sampleRate/an.fftSize, top=Math.max(2,Math.round(180/hz));
  let bass=0; for(let i=1;i<=top;i++)bass+=data[i]; bass/=top;
  let all=0; for(let i=1;i<data.length/4;i++)all+=data[i]; all/=data.length/4;
  const e=bass*.75+all*.25, sense=val("sens")/100;
  audio.avg=audio.avg*.94+e*.06;
  if(e>audio.avg*(1.15+(1-sense)*.9)&&e>40+(1-sense)*80&&now-audio.last>140){   // a jump above the recent level = a beat
    audio.last=now; live=true; jump(Math.min(2.2,(e-audio.avg)/Math.max(10,audio.avg)*4)*7);
  }
}

// ---------- no phone? arrow keys or drag to tilt
const keys={};
addEventListener("keydown",e=>{keys[e.key]=true;keyTilt()}); addEventListener("keyup",e=>{keys[e.key]=false;keyTilt()});
function keyTilt(){if(tilting&&play.tilt)return;const x=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),y=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);if(x||y){live=true;setGravity(x/Math.hypot(x,y),y/Math.hypot(x,y))}}

// ---------- taps: one pushes, two bring back the menu
let down=null, lastTap=0;
cv.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointermove",e=>{
  if(!down||(tilting&&play.tilt))return; const dx=e.clientX-down.x,dy=e.clientY-down.y,d=Math.hypot(dx,dy);
  if(d>12){live=true;setGravity(dx/d,dy/d)}
});
cv.addEventListener("pointerup",e=>{
  if(!down)return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; live=true;
  if(moved>=12)return;
  const now=performance.now();
  if(now-lastTap<320){showGear();lastTap=0}
  else{lastTap=now;if(play.tap)push(e.clientX,e.clientY,5)}
});

// ---------- run + draw
let last=0, acc=0, slow={t:0,n:0,told:false};
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000); last=now; acc+=dt;
  if(live&&!slow.told&&val("pieces")==="letters"){   // a phone that can't keep up gets a tip, once
    slow.n++; slow.t+=dt; if(slow.t>3){if(slow.n/slow.t<24){slow.told=true;hint("slow? menu → pieces → pairs")}slow.t=slow.n=0}
  }
  listen(now);
  while(acc>=1/60){if(world&&live)world.step(1/60,3,1);acc-=1/60}
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.fillStyle=page.bg; ctx.fillRect(0,0,page.W,page.H);
  for(const l of letters){
    ctx.fillStyle=l.c;
    if(l.body){const p=l.body.getPosition();ctx.save();ctx.translate(p.x*S,p.y*S);ctx.rotate(l.body.getAngle());ctx.translate(-l.o.x,-l.o.y);ctx.fill(l.p2d);ctx.restore()}
    else ctx.fill(l.p2d);
  }
  requestAnimationFrame(frame);
}
function rebuild(){
  if(!font)return; save(); showOut();
  const {W,H}=area(); S=W/14;
  cv.width=Math.round(W*devicePixelRatio); cv.height=Math.round(H*devicePixelRatio);
  const L=layout(); page={W:L.W,H:L.H,bg:L.bg}; letters=buildLetters(L);
  document.body.style.background=page.bg; document.querySelector('meta[name=theme-color]').content=page.bg;
  makeWorld(); live=tilting;
}

function useFont(buf,name){
  try{font=opentype.parse(buf)}catch(e){msg("Could not read that font");return}
  $("fontName").textContent=name;
  const miss=[...new Set(val("letters"))].flatMap(c=>[c.toUpperCase(),c.toLowerCase()]).filter(c=>/\p{L}/u.test(c)&&!font.charToGlyph(c).index);
  msg(miss.length?"Not in the font yet, skipped: "+[...new Set(miss)].join(" "):"");
  rebuild();
}
$("fontFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f)return; const buf=await f.arrayBuffer();
  try{let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));store.set("ten-tilt-font",JSON.stringify({name:f.name.replace(/\.[^.]+$/,""),data:btoa(s)}))}catch(e){}
  useFont(buf,f.name.replace(/\.[^.]+$/,""));
});
const bytes=b64=>{const b=atob(b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
let stored=null; try{stored=JSON.parse(store.get("ten-tilt-font")||"null")}catch(e){}
if(stored)useFont(bytes(stored.data),stored.name); else useFont(bytes(BUILTIN),"tenyears");

// ---------- controls
for(const id of ids){const e=$(id);if(e.type!=="hidden")e.addEventListener("input",()=>{showOut();if(!["heavy","sens"].includes(id))rebuild();else save()})}
$("heavy").addEventListener("change",rebuild);
for(const g of document.querySelectorAll(".seg"))g.addEventListener("click",e=>{const b=e.target.closest("button");if(b){$(g.dataset.for).value=b.dataset.v;rebuild()}});
$("kRandBg").addEventListener("click",()=>{$("randBg").checked=!$("randBg").checked;rebuild()});
for(const k of ["tilt","shake","tap"])$("k"+k[0].toUpperCase()+k.slice(1)).addEventListener("click",()=>{play[k]=!play[k];if(k==="tilt"&&!play.tilt)setGravity(0,1);showOut();save()});
$("kSound").addEventListener("click",async()=>{
  if(play.sound){play.sound=false;soundOff()}else if(await soundOn()){play.sound=true;msg("")}
  showOut();
});
$("allLetters").addEventListener("click",()=>{$("letters").value="ABCDEFGHIJKLMNOPQRSTUVWXYZ";rebuild()});
$("shuffle").addEventListener("click",()=>{seed++;rebuild()});
$("reset").addEventListener("click",rebuild);
let rt=0; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(rebuild,250)});
requestAnimationFrame(frame);
}
